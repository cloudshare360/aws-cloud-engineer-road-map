<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting - AWS Cloud Engineer Roadmap</title>
</head>
<body>
  <p>Looking for the requested document...</p>
  <script>
    const path = window.location.pathname;
    const projectRoot = '/aws-cloud-engineer-road-map';
    const docsPath = `${projectRoot}/docs${path.slice(projectRoot.length)}`;
    fetch(docsPath, { method: 'HEAD' }).then((response) => {
      if (response.ok) window.location.replace(docsPath + window.location.search);
    });
  </script>
</body>
</html>
