<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting - AWS Cloud Engineer Roadmap</title>
</head>
<body>
  <p>Looking for the requested document...</p>
  <script>
    const path = window.location.pathname;
    const projectRoot = '/aws-cloud-engineer-road-map';
    const legacyPrefix = `${projectRoot}/docs/`;
    const sitePath = path.startsWith(legacyPrefix)
      ? `${projectRoot}/${path.slice(legacyPrefix.length)}`
      : `${projectRoot}/`;
    fetch(sitePath, { method: 'HEAD' }).then((response) => {
      if (response.ok && sitePath !== path) window.location.replace(sitePath + window.location.search);
    });
  </script>
</body>
</html>
